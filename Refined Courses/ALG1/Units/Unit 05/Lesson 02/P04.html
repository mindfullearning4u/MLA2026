<div style="font-family: Arial, Helvetica, sans-serif; font-size: 18px; line-height: 1.75; color: #1f2933; max-width: 980px; margin: 0 auto 22px auto; border: 1px solid #d1d5db; border-radius: 10px; padding: 22px; background: #ecfdf5; border-left: 6px solid #059669;"><h2 style="font-size: 24px; margin-top: 0; margin-bottom: 10px;">Worked Example</h2><p style="margin-bottom: 14px;"><strong>Factor:</strong> \(x^2+2x-15\)</p><p style="margin-bottom: 14px;">Find two numbers that multiply to -15 and add to 2. The numbers are 5 and -3.</p><p style="margin-bottom: 14px;">So \(x^2+2x-15=(x+5)(x-3)\).</p><p style="margin-bottom: 14px;">The zeros are \(x=-5\) and \(x=3\) because each factor can be set equal to 0.</p></div>
